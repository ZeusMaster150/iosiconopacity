name: Build IconOpacity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout tweak repo
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o project.zip

      - name: Install tools
        run: |
          brew install ldid make dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $HOME/theos/sdks
          cp -R /tmp/sdks/*.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconOpacity-deb
          path: packages/*.deb

      - name: Checkout Sileo repo
        uses: actions/checkout@v4
        with:
          repository: ZeusMaster150/ZeusMaster150.github.io
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages

      - name: Publish to Sileo repo
        run: |
          mkdir -p pages/assets/iconopacity pages/depictions
          cp -R site/assets/iconopacity/. pages/assets/iconopacity/
          cp site/depictions/*.json pages/depictions/
          [ -f pages/index.html ] || cp site/index.html pages/index.html
          python3 make_repo.py packages pages
          cd pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publish Icon Opacity" || echo "Nothing to commit"
          git push

      - name: Save sources in tweak repo
        run: |
          rm -f project.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update tweak sources" || echo "Nothing to commit"
          git push
